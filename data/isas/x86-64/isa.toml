# ---------------------------------------------------------------------------
# 标志位
# ---------------------------------------------------------------------------
[[flags]]
name = "CF"
bit = 0
semantics = "无符号进位/借位;无符号比较与溢出的判定依据"
watch = true
[[flags]]
name = "PF"
bit = 2
semantics = "低 8 位中 1 的个数为偶数时置 1(奇偶校验)"
watch = false
[[flags]]
name = "AF"
bit = 4
semantics = "低 4 位半进位(BCD 运算用)"
watch = false
[[flags]]
name = "ZF"
bit = 6
semantics = "结果为 0 时置 1"
watch = true
[[flags]]
name = "SF"
bit = 7
semantics = "结果最高位为 1(有符号视角即负数)"
watch = true
[[flags]]
name = "DF"
bit = 10
semantics = "串操作方向:1 = 递减"
watch = false
[[flags]]
name = "OF"
bit = 11
semantics = "有符号溢出:同号相加得异号(或异号相减得同号)"
watch = true

