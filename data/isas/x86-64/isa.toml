# x86-64 ISA 数据包(Phase 1)
# schema: docs/ISA_DESIGN.md §2 · 数据由 lab-core::isa 加载
# 执行真值来自 Unicorn(spikes/unicorn_step_diff/RESULT.md),本文件的
# instruction_notes 仅供解释层,不参与执行。

[isa]
id = "x86-64"
name = "Intel/AMD x86-64"
endian = "little"
emulator_arch = "unicorn:x86"
emulator_mode = "unicorn:x86-64"
assembler = "nasm"
assembler_syntax = "intel"

# 单步面板寄存器顺序(教学重点排前)
panel_registers = [
  "RAX", "RBX", "RCX", "RDX", "RSI", "RDI", "RBP", "RSP",
  "R8", "R9", "R10", "R11", "R12", "R13", "R14", "R15",
  "RIP", "RFLAGS",
]

# 栈顶初始值(留 0x1000 余量,[RSP] 处写终止桩地址)
stack_init = "0x7FF0000FF000"
# 程序 ret 到此地址 = 正常结束(位于代码段末尾,已映射,由 code hook 拦截)
exit_sentinel = "0x004FFF00"

[isa.syscall_stub]
implemented = { "0" = "read", "1" = "write", "12" = "brk", "60" = "exit" }
note = "教学桩实现(Linux 语义子集),非真实内核调用"


[isa.memory_map.code]
base = "0x00400000"
size = 0x100000
name = "代码段"

[isa.memory_map.data]
base = "0x00600000"
size = 0x100000
name = "数据段"

[isa.memory_map.heap]
base = "0x01000000"
size = 0x100000
name = "堆"

[isa.memory_map.stack]
base = "0x7FF000000000"
size = 0x100000
name = "栈"

