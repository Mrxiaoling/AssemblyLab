# L10.3 — 阶段十:x86-64 vs ARM64 对比(ARM 与嵌入式 ③)

[lesson]
id = "stage10-lesson03"
title = "同一段 C++,两个世界:系统化对比方法"
stage = 10
requires = ["stage10-lesson02", "stage05-lesson01"]
estimated_minutes = 40

[lesson.goal]
problem = "学会一套方法论:拿到任意 C++,如何在两个架构上并排读懂它?"
outcomes = ["会用优化对比页做跨架构对照", "掌握差异的完整清单(寄存器/标志/调用/立即数)", "建立'语义一致、机制不同'的双架构阅读习惯"]

[lesson.experiment]
mode = "compare"
isa = "x86-64"
source = '''// 对比实验:数组求和。分别在 g++ 与 aarch64-linux-gnu-g++ 下看 -O2
long sum_array(const long* a, long n) {
    long s = 0;
    for (long i = 0; i < n; i++) {
        s += a[i];
    }
    return s;
}

long get(const long* a, long i) {
    return a[i];
}
'''
watch = []

[[steps]]
kind = "problem"
title = "本节要解决的问题"
content = """
前两课分别建立了两个世界的直觉。本节把方法固化:
**任何一段 C++,先看四个维度**——①参数怎么传 ②循环怎么数
③内存怎么访问 ④标志怎么用。用「优化对比」页的跨编译器能力并排验证。
"""

[[steps]]
kind = "run"
title = "实验:并排对比"
content = """
点「打开本课实验」进入优化对比页(源码已预载)。
勾选 O2,先只看 g++,再切 **aarch64-linux-gnu-g++** 单独对比,
最后两次运行心里对照。别急着逐行——先数指令数、找循环、认参数寄存器。
"""

[[steps]]
kind = "walkthrough"
title = "维度①②:参数与下标"
content = """
- x86:`sum_array` 参数在 RDI(a)、RSI(n);`get` 的 `a[i]` 是
  `mov rax,[rdi+rsi*8]`——scale 编码进指令
- ARM64:参数在 X0(a)、X1(n);下标是
  `ldr x0, [x0, x1, lsl #3]`——**移位写进寻址操作数**(lsl #3 = ×8)

两边的"乘 8"都由硬件完成,但表达方式完全不同:x86 是 scale 字段,
ARM64 是寄存器操作数的移位扩展。
"""

[[steps]]
kind = "state"
title = "维度③④:内存与标志"
content = """
- x86 循环:`add rcx,1` + `cmp` + `jle`——add 顺手置标志,cmp 重置
- ARM64 循环:`add x1, x1, #1` + `cmp`(或直接 `subs x1,x1,#1` + `b.gt`)
  ——**普通 add 不碰标志**,要么 cmp 补一刀,要么直接用 subs 一石二鸟

ARM64 的 `cmp x1, x2` 也是 subs 到 xzr 的语法糖;条件跳转用 b.cond(eq/lt/gt/le/…),
和 x86 的 jcc 一一对应(注意 C 标志语义相反:Carry=无借位)。
"""

[[steps]]
kind = "theory"
title = "对比方法论(带走这张表)"
content = """
| 维度 | x86-64 | ARM64 |
|---|---|---|
| 变长/定长 | 1-15 字节变长 | **恒 4 字节**(PC 相对寻址因此成为常态) |
| 大立即数 | 可嵌 64 位 imm(movabs) | 16 位段 movz/movk 或字面池 |
| flags | 6+ 位,多数算术更新 | NZCV,仅 adds/subs/cmp 等 |
| 条件执行 | jcc/setcc/cmov | b.cond/cset/csel(可条件选寄存器) |
| 函数调用 | call 压栈 | bl 写 LR |
| 栈帧 | rbp 链(可选) | x29 链(可选,惯例同) |
| SIMD | SSE/AVX(XMM 16-32 个) | NEON(V0-V31,128 位) |
"""

[[steps]]
kind = "cpp-link"
title = "与 C++ 的联系"
content = """
C++ 标准从不提及寄存器——所以同一份代码双架构行为一致是**由编译器保证**的。
你要建立的技能是:在两份汇编间建立"语义映射表",
这既是逆向工程的基本功,也是性能移植(uarch 差异)的入口。
"""

[[steps]]
kind = "pitfalls"
title = "常见误区"
content = """
- ❌ "ARM64 汇编比 x86 简单所以性能差" —— 指令集哲学不同,性能看微架构
- ❌ "条件助记符能直接对照" —— C(借位)语义相反;hs/lo ≠ ja/jb 的直觉
- ❌ "对比就是逐行翻译" —— 优化器会重排/合并;对比要按**语义块**(函数/循环)对齐
"""

[[steps]]
kind = "hands-on"
title = "动手:三连对比实验"
content = """
在优化对比页依次验证:
1. `sum_array` 的 O2:两个架构都向量化了吗?(找 NEON 的 ldp/add(.2d) vs x86 的 paddq)
2. 把 long 换成 int:参数寄存器从 X/W 的变化
3. 加一个 `if (a[i] > 100) s = s * 2;`:条件执行两侧分别用什么(csel vs cmov)?
"""

[[steps]]
kind = "exercise"
title = "课后习题"
content = "预测:给定 ARM64 汇编片段的运行结果(习题中心,ARM64 判题)。"

[[steps]]
kind = "summary"
title = "本节总结"
content = """
- 四维度对比法:参数/循环/内存/标志
- 定长指令 → PC 相对寻址;大常量 → movz/movk 或字面池
- 语义一致、机制不同:这是读双架构汇编的唯一正确姿势
"""

[[steps]]
kind = "links"
title = "关联知识"
nodes = ["isa-comparison", "aapcs64", "condition-codes", "neon-vs-sse"]

[[steps]]
kind = "next"
title = "下一步"
content = "更高阶:阶段七协程 / 阶段八 OS 与并发。"
