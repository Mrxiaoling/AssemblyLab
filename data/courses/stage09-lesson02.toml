# L9.2 — 阶段九:CAS 与自旋锁(并发与数据并行 ②)

[lesson]
id = "stage09-lesson02"
title = "lock cmpxchg:十亿个线程抢一把锁的机器原理"
stage = 9
requires = ["stage09-lesson01", "stage08-lesson02"]
estimated_minutes = 45

[lesson.goal]
problem = "mutex.lock() 在 CPU 层面是什么?锁住的那'一瞬间'靠哪条指令?"
outcomes = ["读懂 CAS 三元组(期望值/内存/新值)", "手写 lock cmpxchg 获取+释放自旋锁", "理解为什么 CAS 需要 lock 前缀"]

[lesson.experiment]
mode = "asm"
isa = "x86-64"
source = '''[bits 64]
org 0x400000
global _start

_start:
    ; 尝试获取锁:内存=0(未锁)→ 换成 1(锁上)
acquire:
    mov     eax, 0          ; 期望:未锁
    mov     edx, 1          ; 要写入:已锁
    lock cmpxchg dword [lock_var], edx
    jz      got_it          ; ZF=1:内存==eax,交换成功
    ; 失败路径:eax 已被换成内存当前值(=1,别人锁着)→ 自旋重试
    pause
    jmp     acquire
got_it:
    ; ===== 临界区:改共享数据 =====
    inc     dword [shared]
    ; ===== 释放锁:直接写 0(自旋锁的释放就是一条普通写)=====
    mov     dword [lock_var], 0
    mov     eax, [shared]   ; 验证临界区生效
    mov     rax, 60
    mov     edi, 1          ; exit(1)=拿到过锁
    syscall

align 512
lock_var: dd 0           ; 0=未锁 1=已锁
shared:   dd 0           ; 临界区里的共享数据
'''
watch = ["RAX", "RFLAGS"]

[[steps]]
kind = "problem"
title = "本节要解决的问题"
content = """
两个线程同时 `if (lock == 0) lock = 1;`——检查和写入之间有人插队怎么办?
硬件答案:**CAS(compare-and-swap)**,x86 上就是
`lock cmpxchg`:**比较+交换在一条指令内原子完成**,中间无法插队。
mutex 的 lock() 底层就是循环执行这条指令(自旋)。
"""

[[steps]]
kind = "run"
title = "实验:成功路径"
content = """
点「打开本课实验」→ 单步:
`mov eax,0`(期望未锁)→ `lock cmpxchg dword [lock_var], edx`:
内存 0x42?不——初始 0 == eax → **交换成 1,ZF=1** → jz 走成功路径
→ 临界区 shared=1 → 释放(普通写 0)→ exit(1)。
内存面板盯 lock_var(0x400230)与 shared(0x400234)。
"""

[[steps]]
kind = "walkthrough"
title = "cmpxchg 的完整语义"
content = """
`lock cmpxchg [mem], edx` 等价于(原子):

```
ZF = (eax == [mem])
if (ZF)  [mem] = edx      // 成功:写入新值
else     eax = [mem]      // 失败:把当前值带回 eax(下次重试的期望值)
```

三条事实:
1. **比较值必须在 RAX**(硬件规定)
2. **ZF 是成败信号**(成功 1/失败 0)
3. **lock 前缀**保证多核下这条指令独占缓存行——没有它,CAS 就是普通两条指令,照样被插队
"""

[[steps]]
kind = "state"
title = "失败路径与自旋"
content = """
把初始 lock_var 改成 `dd 1`(模拟"别人已锁")再跑:
cmpxchg 失败(ZF=0),**eax 自动变成内存当前值 1**——这就是"失败也带回信息"的设计,
重试循环直接用。`pause` 指令:告诉 CPU"这是自旋循环"(省电+避免内存序乱猜)。

单核模拟器里锁必成功;多核世界里 acquire 循环可能转几百圈——
所以真实 mutex 自旋几次后走 futex 交给内核睡眠(阶段八的 syscall 回来了)。
"""

[[steps]]
kind = "theory"
title = "ABA 与锁的释放"
content = """
- CAS 只比较"值相等":内存 0x42→0x43→0x42 的往返,CAS 看不出变过——**ABA 问题**;
  解法:版本号一起比(带 tag 的 CAS)
- 自旋锁释放 = 一条普通 store(0)。它为什么安全?x86 强内存模型保证
  store 顺序全局可见——ARM64 上就不行了,必须 stlxr/dmb(下一课)
- lock 前缀的现代实现是**缓存行锁定**(非锁总线):只锁一个 cache line,
  同行邻居遭殃——"伪共享"(两个热变量挤一行)的性能杀手
"""

[[steps]]
kind = "cpp-link"
title = "与 C++ 的联系"
content = """
```cpp
std::atomic<int> lk{0};
lk.compare_exchange_strong(0, 1);   // ≈ lock cmpxchg(ZF 就是返回的 bool)
lk.fetch_add(1);                    // ≈ lock xadd
std::mutex lk2; lk2.lock();         // 混合:先 CAS 自旋,futex 睡眠兜底
```
在「优化对比」页编译 `lk.fetch_add(1)`:x86 -O2 = `lock xadd`;
aarch64 = `ldaddal`(或 ldxr/stxr 循环)——同一 C++,两套原子机制。
"""

[[steps]]
kind = "pitfalls"
title = "常见误区"
content = """
- ❌ "cmpxchg 本身就是原子的" —— 没有 lock 前缀不是!
- ❌ "CAS 成功说明没人动过" —— 只说明值相等(ABA)
- ❌ "释放锁要再 CAS" —— 自旋锁释放就是普通写;更复杂的锁才需要
"""

[[steps]]
kind = "hands-on"
title = "动手:失败路径走一遍"
content = """
把 lock_var 初始改 `dd 1`,并在失败路径加 `mov [tries], eax` 记录:
单步看 eax 在 cmpxchg 后被填成内存当前值——重试逻辑的数据来源。
再把 edx 改 2:成功后 lock_var=2——"新值"完全由你定,1 只是约定。
"""

[[steps]]
kind = "exercise"
title = "课后习题"
content = "预测:给定初值的 cmpxchg 后 ZF 与寄存器/内存状态。见习题中心。"

[[steps]]
kind = "summary"
title = "本节总结"
content = """
- CAS 原子三元组:RAX(期望)/[mem](目标)/寄存器(新值);ZF 报成败
- lock 前缀 = 多核原子性;pause 给自旋循环
- 自旋锁 = CAS 循环获取 + 普通写释放;失败时 eax 带回现值
"""

[[steps]]
kind = "links"
title = "关联知识"
nodes = ["cas", "lock-prefix", "spinlock", "false-sharing", "futex"]

