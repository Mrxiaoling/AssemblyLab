# L1 — 阶段一:一个加法程序的一生
# schema 见 docs/COURSE_DESIGN.md(15 步模板;P1 采用内容流简化渲染)

[lesson]
id = "stage01-lesson01"
title = "一个加法程序的一生"
stage = 1
requires = []
estimated_minutes = 30

[lesson.goal]
problem = "CPU 到底在做什么?——从 int c = a + b 追到每一条指令"
outcomes = ["理解取指-执行循环与 RIP", "区分寄存器与内存", "读懂一段最小汇编"]

[lesson.experiment]
isa = "x86-64"
source = '''
[bits 64]
org 0x400000
global _start

_start:
    mov eax, 10        ; a = 10
    mov ebx, 20        ; b = 20
    add rax, rbx       ; c = a + b
    mov [result], rax  ; 把结果存进内存
    mov rax, 60
    mov edi, 7
    syscall

result: dq 0
'''
watch = ["RAX", "RBX", "RIP", "RFLAGS"]

[[steps]]
kind = "problem"
title = "本节要解决的问题"
content = """
你在 C++ 里写 `int c = a + b;`,编译器把它变成机器指令,CPU 逐条执行。
**CPU 到底执行了什么?** 本节我们把这段 C++ 的等价汇编放到模拟器里,**一条一条**看它跑完。
"""

[[steps]]
kind = "run"
title = "先运行一个程序"
content = """
点击下方按钮在实验工作台中打开本课实验,然后点「▶ 运行」:程序瞬间跑完并退出(返回码 7)。
运行太快看不清?没关系——下一步我们改用**单步**。
"""

[[steps]]
kind = "walkthrough"
title = "逐条执行:观察每一步"
content = """
在工作台中连续点「单步」3 次,注意右侧:

1. **第 1 步** `mov eax,10`:RAX 从 0 变成 0xa(十进制 10),RIP 从 0x400000 前进到 0x400005。
2. **第 2 步** `mov ebx,20`:RBX 变成 0x14(20)。
3. **第 3 步** `add rax,rbx`:RAX 变成 0x1e(30),**RFLAGS 出现变化**——低 8 位里 1 的个数是偶数,PF 置 1。

每一步解释卡都会告诉你:哪些寄存器变了、标志位为什么变、这条指令和 C++ 的哪句话对应。
"""

[[steps]]
kind = "state"
title = "寄存器 vs 内存"
content = """
第 4 步 `mov [result],rax` 把 30 写进内存地址 0x400026(解释卡的「写内存」行)。

- **寄存器**:CPU 内部的存储单元,数量少、速度极快。RAX/RBX 就是两个"变量"。
- **内存**:容量大但每次访问都要走地址。`[result]` 是一个内存地址。

C++ 的 `int c = a + b;` 编译后正是"寄存器里算,算完写回内存"。
"""

[[steps]]
kind = "theory"
title = "取指-执行循环"
content = """
CPU 的工作就是一个永不停歇的循环:

```
while (true) {
    指令 = 内存[RIP]        // 取指(fetch)
    执行指令                  // 执行(execute)
    RIP += 指令长度           // 指向下一条(或被 JMP/CALL 改写)
}
```

你刚才单步看到的 RIP 前进,就是这个循环。`syscall` 退出是教学桩提供的出口,
真实 Linux 里它会陷入内核(第八阶段细讲)。
"""

[[steps]]
kind = "pitfalls"
title = "常见误区"
content = """
- ❌ "C++ 直接被 CPU 执行" —— CPU 只执行机器码;C++ 先被编译。
- ❌ "寄存器和内存是一回事" —— 你已经亲眼看到:运算发生在寄存器,内存是"仓库"。
- ❌ "RIP 可以随便改" —— 它只能被跳转类指令(JMP/CALL/RET)改写,本课没出现。
"""

[[steps]]
kind = "hands-on"
title = "动手实验:先预测,再验证"
content = """
在工作台里**修改源码**:把 `mov ebx, 20` 改成 `mov ebx, 50`,重新编译源码,
先在心里预测 RAX 最终是多少,再单步验证。(答案:0x2a,因为 10+50=60=0x3c?不——
别急,自己跑一遍!注意 `sub eax,5` 不在本程序里……看清楚代码再预测。)
"""

[[steps]]
kind = "exercise"
title = "课后习题"
content = """
本课配套 2 道习题:一道预测题、一道补全题。前往「习题中心」完成,
判题器会用真实引擎执行你的答案。
"""

[[steps]]
kind = "summary"
title = "本节总结"
content = """
- CPU 执行的是机器指令,RIP 指向当前指令。
- 运算发生在寄存器;内存通过地址读写。
- 一条指令 = 操作码 + 操作数;你已认识 MOV(搬数据)与 ADD(加法)。
"""

[[steps]]
kind = "links"
title = "关联知识"
nodes = ["registers", "rip", "memory-vs-register", "mov", "add"]

[[steps]]
kind = "next"
title = "下一步"
content = "阶段二第 1 课:数据如何在寄存器与内存之间移动(交换两个变量)。"
