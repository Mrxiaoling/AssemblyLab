# L8.1 — 阶段八:syscall 之旅(OS 与并发 ①)

[lesson]
id = "stage08-lesson01"
title = "write 系统调用:从寄存器到内核的那条线"
stage = 8
requires = ["stage04-lesson01", "stage03-lesson02"]
estimated_minutes = 40

[lesson.goal]
problem = "printf 的底层 write(fd, buf, len) 在 CPU 层面是哪几条指令?内核怎么收到参数?"
outcomes = ["掌握 Linux x86-64 syscall 约定(RAX=编号,RDI-RDX=参数)", "逐步观察 syscall 指令的前后", "理解用户态/内核态边界的含义"]

[lesson.experiment]
mode = "asm"
isa = "x86-64"
source = '''[bits 64]
org 0x400000
global _start

_start:
    mov     rax, 1          ; SYS_write = 1
    mov     rdi, 1          ; fd = 1 (stdout)
    lea     rsi, [msg]      ; buf = msg 的地址
    mov     rdx, 13         ; len = 13
    syscall                 ; ← 用户态到此为止
    ; 返回后:RAX = 实际写入字节数(桩返回 len)
    mov     rax, 60         ; SYS_exit = 60
    mov     edi, 0
    syscall

align 512
msg: db "hello kernel!", 10   ; 13 字节(含换行)
'''
watch = ["RAX", "RDI", "RSI", "RDX"]

[[steps]]
kind = "problem"
title = "本节要解决的问题"
content = """
阶段一你已见过 `syscall` 能退出程序。现在认真拆一次 **write**:
内核怎么知道你要写哪个文件、写什么、写多少?

答案朴素到令人失望:**全部通过寄存器**。约定(非硬件规定,是 Linux 的 ABI):
- RAX = syscall 编号(write=1)
- RDI/RSI/RDX = 前三个参数(fd/buf/len)
"""

[[steps]]
kind = "run"
title = "实验:单步到 syscall"
content = """
点「打开本课实验」→ 工作台单步。
四条 mov/lea 装参数 → 执行 `syscall` → **看输出面板**:"hello kernel!" 出现了。
再单步:RAX = 0xD(13)= write 的返回值。
"""

[[steps]]
kind = "walkthrough"
title = "syscall 瞬间:发生了什么"
content = """
真实系统里,`syscall` 指令:
1. CPU 切到内核态(Ring 3 → Ring 0),PC 跳到内核入口(LSTAR 寄存器指定的固定地址)
2. 内核入口**保存用户寄存器现场**(第八阶段第三节细讲)
3. 按 RAX 查系统调用表 → 调用内核的 sys_write → 检查参数、拷贝用户缓冲区、写文件
4. 恢复现场、sysret 回到用户态的下一条

教学模拟器里:syscall 触发**桩**——读取 RAX/RDI/RSI/RDX,
把 RSI 指向的 13 字节拷给输出面板,RAX 填返回值。桩替代了内核,但**约定一模一样**。
"""

[[steps]]
kind = "state"
title = "参数指针:lea 又来了"
content = """
`lea rsi, [msg]`:第三阶段说过——lea 只算地址不读内存。
write 的第二参数要的是**缓冲区的地址**,不是内容;
内核拿到地址后自己去读那 13 字节(真实系统里会 copy_from_user 检查越界)。
"""

[[steps]]
kind = "theory"
title = "用户态/内核态:这条线为什么存在"
content = """
- CPU 用特权级隔离:用户态不能直接碰硬件/别的进程内存——**必须**通过 syscall 委托内核
- syscall 编号是内核的"服务菜单":1=write、60=exit(见 ISA 包 syscall_stub 注释)
- 编号约定是 Linux ABI 的一部分(Windows 用别的机制);**这不是 x86 硬件规定**
- 桩模拟了"菜单+参数约定",但跳过了特权切换、调度、中断——如实标注
"""

[[steps]]
kind = "cpp-link"
title = "与 C++ 的联系"
content = """
```cpp
std::printf("hello kernel!\n");   // → vfprintf → write(1, buf, n) → syscall
```
printf 只是个用户态格式化库,最终那一下还是本节的 syscall。
strace 能看到每个进程的 syscall 序列——你刚刚亲手走的是其中同一条。
"""

[[steps]]
kind = "pitfalls"
title = "常见误区"
content = """
- ❌ "syscall 编号是 CPU 定的" —— 是内核 ABI;Windows 同一条指令、另一套菜单
- ❌ "syscall 会保存全部寄存器" —— 用户现场保存是内核入口软件干的;约定只保证 RCX/R11 被硬件占用
- ❌ "write 一定一次写完" —— 内核可能写一半返回字节数;真实代码要检查 RAX
"""

[[steps]]
kind = "hands-on"
title = "动手:改 fd 与长度"
content = """
1. `mov rdx, 5` 再跑:只输出 "hello";RAX = 5(桩如实返回)
2. `mov rdi, 2`(stderr)再跑:输出面板带 [stderr] 前缀——fd 就是这么进内核的
3. 把 RAX 改成 99 再 syscall:桩报"未实现的 syscall 号"——菜单里没有的服务
"""

[[steps]]
kind = "exercise"
title = "课后习题"
content = "预测:给定参数布局的 write 调用返回后 RAX 与输出。见习题中心。"

[[steps]]
kind = "summary"
title = "本节总结"
content = """
- syscall 约定:RAX 编号,RDI/RSI/RDX/R10/R8/R9 参数,RCX/R11 被硬件占用
- write(1, buf, len) 四步装参 + 一条 syscall;返回值在 RAX
- 用户态/内核态边界 = 特权级 + 内核入口;桩还原约定不还原内核
"""

[[steps]]
kind = "links"
title = "关联知识"
nodes = ["syscall", "user-kernel-boundary", "linux-abi", "strace"]

[[steps]]
kind = "next"
title = "下一步"
content = "不进内核也能切换执行流:用户态上下文切换原型。"
