# L6.2 — 阶段六:虚函数与虚表(C++ 对象模型 ②)

[lesson]
id = "stage06-lesson02"
title = "虚调用:mov rax,[rdi] 后,call 的不是函数是表项"
stage = 6
requires = ["stage06-lesson01"]
estimated_minutes = 45

[lesson.goal]
problem = "p->f() 怎么在运行期找到正确的函数?虚表长什么样?"
outcomes = ["读懂虚调用的两步取表汇编", "在内存面板亲眼看到 vptr 与虚表", "理解虚函数的运行时代价"]

[lesson.experiment]
mode = "debug"
isa = "x86-64"
source = '''struct Base {
    virtual int f() { return 1; }
    int g() { return 10; }
};

struct Der : Base {
    int f() override { return 2; }
};

int main() {
    Der d;
    Base* p = &d;
    int a = p->f();   // 虚调用:运行期决定
    int b = p->g();   // 普通调用:编译期决定
    return a + b;
}
'''
watch = []

[[steps]]
kind = "problem"
title = "本节要解决的问题"
content = """
`p` 的静态类型是 `Base*`,但 `p->f()` 却执行了 `Der::f` ——
编译期根本不知道 p 指着谁,运行期怎么"选对函数"?

C++ 的答案:**虚表(vtable)**。
每个含虚函数的多态对象,头部藏一个指针;每个类一张表,表里装虚函数地址。
"""

[[steps]]
kind = "run"
title = "真机调试:停在虚调用前"
content = """
点「打开本课实验」,「编译并启动调试」(断在 main)。
在 `int a = p->f();`(第 13 行)设断点,「▶ 继续」停下。
"""

[[steps]]
kind = "walkthrough"
title = "虚调用 vs 普通调用"
content = """
看反汇编面板两条调用的差异:

```
; a = p->f()          ; b = p->g()
mov  rax, [rdi]       ; vptr = p->vptr(对象头 8 字节)
call [rax+offset]     ; 调表项 → 间接调用
                      mov  edi, [rdi+?]   ; 或寄存器传参
                      call Der::g / Base::g   ; 直呼其名,编译期定死
```

虚调用 = **先取 vptr,再从表里取函数地址,call 它**。
多一次内存读 + 一次间接跳转,这就是"虚函数开销"的全部真相
(内联器对虚调用束手无策,也是开销的另一面)。
"""

[[steps]]
kind = "state"
title = "亲眼看虚表"
content = """
停在第 13 行时(RDI = p = &d):
1. 内存面板输入 RDI 的值,**uint64 视图**:第一个 8 字节 = vptr(一个 .rodata 附近的地址)
2. 把该地址填进内存面板再按 uint64 看:表项一(f → Der::f 的地址)、表项二(析构)……
3. 对比 `Base b;` 的 vptr:另一个地址、表项一指向 Base::f

**多态 = 对象头那个 8 字节指针选了不同的表**。
"""

[[steps]]
kind = "theory"
title = "虚表谁建、何时建"
content = """
- 编译器为**每个类**生成一张只读虚表(.rodata),内容 = 该类各虚函数的最终覆写版地址
- **构造函数开头**偷偷执行 `mov [obj], vptr_of_class` —— 对象出生时就装好 vptr
- 这解释了构造/析构期间虚调用的著名陷阱:基类构造时 vptr 指向基类表,调虚函数不会下探到派生类
"""

[[steps]]
kind = "cpp-link"
title = "与 C++ 的联系"
content = """
```cpp
Base b;      // sizeof(Base) == 16: vptr(8) + 无成员但虚析构占位/对齐
Der d;       // vptr 在构造时被写成 &Der_vtable
```
- 没有 virtual 的类:无 vptr,零开销(所以"零开销抽象"才成立)
- `final`/去虚化(devirtualization):O2 下若能证明动态类型,虚调用也会被改写成直调——用优化对比页验证!
"""

[[steps]]
kind = "pitfalls"
title = "常见误区"
content = """
- ❌ "虚函数存在对象里" —— 对象里只有 vptr,函数地址在类级虚表
- ❌ "虚函数一定慢" —— 多一次取表;可去虚化后与普通调用同价
- ❌ "构造函数里可以安全调虚函数" —— vptr 此刻指当前类,派生版不会被调
"""

[[steps]]
kind = "hands-on"
title = "动手:观察点追踪 vptr"
content = """
在「观察点」页签添加观察 `d` (设断点于 `Der d;` 前)然后单步过构造——
对象头 8 字节在构造瞬间被写入 vptr 地址。
再对比 main 里再加一个 `Der e;`:两个对象的 vptr **完全相同**(类只有一张表)。
"""

[[steps]]
kind = "exercise"
title = "课后习题"
content = "预测:Der 对象头部前 8 字节读出的 vptr 指向的表项一属于哪个函数。见习题中心。"

[[steps]]
kind = "summary"
title = "本节总结"
content = """
- 虚调用 = 取 vptr → 查表 → 间接 call;普通调用 = 编译期直调
- vptr 在构造时写入;每类一张只读表
- 虚函数开销 = 一次内存读 + 阻断内联
"""

[[steps]]
kind = "links"
title = "关联知识"
nodes = ["virtual-function", "vtable", "vptr", "devirtualization", "ctor-virtual-trap"]

