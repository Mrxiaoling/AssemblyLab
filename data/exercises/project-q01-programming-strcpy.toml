hints.level1 = "循环体:读 [rdi+rax] 存进 [rsi+rax],等于 0 跳出(别忘了把 0 也复制)。"
hints.level2 = "?? 处:test cl, cl 之后 jz .done(cl 是刚复制的字节,为 0 即到结尾)。参考解析有完整实现。"
answer_md = """
完整参考实现:

```asm
[bits 64]
org 0x400000
; rdi=源, rsi=目标(判题用例预置);复制到 0 为止(含 0)
mov rax, 0
.loop:
    mov cl, [rdi + rax]
    mov [rsi + rax], cl
    test cl, cl
    jz .done
    inc rax
    jmp .loop
.done:
    mov rax, 60
    mov edi, 0
    syscall

align 512
src: db "anatomy", 0
dst: times 16 db 0xCC     ; 用 0xCC 填充:验证"复制到 0 含 0"的边界
```

判题:dst 起点 0x400210,断言复制后的前 8 字节(小端读出即 "anatomy"+0)。
`??` 只挖判断一条;完整循环在参考实现里——先自己写再对照。
"""

