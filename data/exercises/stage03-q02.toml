# 习题:补全寻址指令(阶段三)

[exercise]
id = "stage03-q02-fill-indexed"
type = "fill_blank"
title = "补全:让 int 数组求和写进内存"
stage = 3
lesson = "stage03-lesson02"
knowledge = ["array", "index-scale", "memory-write"]
difficulty = 3
related_experiment = "stage03-lesson02"

hints.level1 = "缺的是带下标寻址的加法:数组元素是 int,scale 是多少?"
hints.level2 = "`add eax, [rbx+rcx*4]`(寄存器大小写均可)。"
answer_md = """
空格填 `add eax, [rbx+rcx*4]`。rbx 是数组首地址、rcx 是当前下标,int 占 4 字节,
所以有效地址是 `rbx + rcx*4`;scale 只能是 1/2/4/8,不能写成 `rcx*sizeof(int)`。
五轮后 EAX=0x23(35),`mov [0x400100], rax` 把结果写入内存,判题器校验该 qword 与退出码 0。
常见错误是写成 `add eax, [rbx+rcx]`(按字节步进)或用 `rax` 做 64 位加法却忽略高位。
"""

[fill_blank]
hole_hint = "一条指令:eax += arr[i](rbx=数组首地址,rcx=i,元素为 int)"
asm_template = '''
[bits 64]
org 0x400000
lea rbx, [arr]
xor ecx, ecx
xor eax, eax
.loop:
cmp ecx, 5
jge .done
??
inc ecx
jmp .loop
.done:
mov [0x400100], rax
mov rax, 60
mov edi, 0
syscall
arr: dd 3, 7, 11, 5, 9
'''

[[fill_blank.testcases]]
expect_exit_code = 0
expect_mem = { addr = "0x400100", qword_le = "0x23" }
